{% extends "base.html" %}

{% block title %}Not found — {{ profile.name }}{% endblock %}

{% block content %}
<div style="padding:48px 0; display:flex; flex-direction:column; gap:14px;">
  <div style="font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--accent);">404</div>
  <h2 style="font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:600;">This page wandered off.</h2>
  <p style="font-size:14.5px; line-height:1.6; color:var(--fg-muted);">The page you were looking for doesn't exist or has moved.</p>
  <a href="/" style="align-self:flex-start; margin-top:6px; display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--fg); text-decoration:none; font-size:13px; font-weight:500; box-shadow:var(--shadow);">Take me home</a>
</div>
{% endblock %}
